  .top a:hover{color:#333}
  .toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
  .toolbar input,.toolbar select{padding:8px 12px;border:1px solid #ddd;border-radius:8px;font-size:13px;background:#fff;outline:none;font-family:inherit}
  .toolbar input{flex:1;min-width:180px}
  .toolbar input:focus,.toolbar select:focus{border-color:#888}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;border:1px solid #eee}
  th{background:#f8f8f8;padding:10px 12px;font-size:12px;font-weight:600;color:#666;text-align:left;cursor:pointer;user-select:none;white-space:nowrap;border-bottom:1px solid #eee}
  th:hover{background:#f0f0f0}
  th .arrow{color:#bbb;margin-left:3px;font-size:11px}
  td{padding:10px 12px;font-size:13px;border-bottom:1px solid #f5f5f5}
  tr:hover td{background:#fafafa}
  tr:last-child td{border-bottom:none}
  .tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
  .tag-cycle{background:#ffebee;color:#c62828}
  .tag-mix{background:#fff3e0;color:#e65100}
  .tag-growth{background:#e8f5e9;color:#2e7d32}
  .tag-def{background:#e3f2fd;color:#1565c0}
  .tag-special{background:#f3e5f5;color:#7b1fa2}
  .score-bar{display:inline-block;height:6px;border-radius:3px;margin-right:6px;vertical-align:middle}
  .count-bar{color:#888;font-size:13px;margin-bottom:12px}
  .empty{text-align:center;color:#aaa;padding:40px;font-size:14px}
  .footer{text-align:center;font-size:12px;color:#ccc;margin-top:40px}
  a{color:#1a73e8;text-decoration:none}
  a:hover{text-decoration:underline}
  .code{color:#999;font-size:12px}
  .badge{display:inline-block;padding:2px 9px;border-radius:4px;font-size:11px;font-weight:700;white-space:nowrap}
  .fwd-s{background:#e8f5e9;color:#1b5e20}
  .fwd-a{background:#f1f8e9;color:#558b2f}
  .fwd-b{background:#fffde7;color:#f9a825}
  .fwd-c{background:#fff3e0;color:#e65100}
  .fwd-d{background:#fde8e8;color:#c0392b}
  .rating-buy{background:#e8f5e9;color:#1b5e20}
  .rating-outperform{background:#f1f8e9;color:#558b2f}
  .rating-neutral{background:#eeeeee;color:#616161}
  .rating-underperform{background:#fff3e0;color:#e65100}
  .rating-sell{background:#fde8e8;color:#c0392b}
  .node{color:#666;font-size:12px}
  .warn{color:#e67e22;font-weight:700;cursor:help}
  .muted{color:#ccc}
  .score-num{font-size:12px;color:#555;margin-left:6px}
</style>
</head>

let sortKey='rating', sortDir=1;
const ratingRank={Buy:0,Outperform:1,Neutral:2,Underperform:3,Sell:4};
const fwdRank={S:0,A:1,B:2,C:3,D:4};

function scoreColor(s){
  if(s>=80) return '#4caf50';
  if(s>=60) return '#ff9800';
  if(s>=40) return '#f44336';
  return '#9c27b0';
}

function typeClass(t){
  const m={'周期性':'tag-cycle','混合周期':'tag-mix','成长性':'tag-growth','防御性':'tag-def','特殊行业':'tag-special'};
  return m[t]||'tag-cycle';
}

function divergence(d){
  const hi = d.score>=80;
  const gf = d.fwd==='S'||d.fwd==='A';
  const bf = d.fwd==='C'||d.fwd==='D';
  if(hi&&bf) return 'high';
  if(!hi&&gf) return 'low';
  return '';
}

function sortVal(d,k){
  if(k==='rating') return ratingRank[d.rating]!==undefined?ratingRank[d.rating]:9;
  if(k==='fwd') return fwdRank[d.fwd]!==undefined?fwdRank[d.fwd]:9;
  if(k==='score') return d.score;
  if(k==='name') return d.name;
  return d[k];
}

function render(){
  const q=document.getElementById('search').value.trim().toLowerCase();
  const f=document.getElementById('filter').value;
  const af=document.getElementById('abfilter').value;
  let rows=data.filter(d=>(!q||d.name.toLowerCase().includes(q)||d.code.toLowerCase().includes(q))&&(!f||d.type===f)&&(!af||divergence(d)===af));
  rows.sort((a,b)=>{
    const v=sortVal(a,sortKey),w=sortVal(b,sortKey);
    if(v<w) return -sortDir;
    if(v>w) return sortDir;
    if(sortKey!=='score'&&a.score!==b.score) return b.score-a.score;
    return 0;
  });
  document.getElementById('count').textContent='共 '+rows.length+' 份';
  const tbody=document.getElementById('tbody');
  tbody.innerHTML=rows.map(d=>{
    const bar='<span class="score-bar" style="width:'+d.score+'%;background:'+scoreColor(d.score)+'"></span>';
    const fwd=d.fwd?'<span class="badge fwd-'+d.fwd.toLowerCase()+'">'+d.fwd+'</span>':'<span class="muted">—</span>';
    const rating=d.rating?'<span class="badge rating-'+d.rating.toLowerCase()+'">'+d.rating+'</span>':'<span class="muted">—</span>';
    const dv=divergence(d);
    const dvc=dv?'<span class="warn" title="'+(dv==='high'?'财务高分但前瞻不利':'财务低分但前瞻有利')+'">⚡</span>':'';
    const node=d.node?'<span class="node">'+d.node+'</span>':'';
    return '<tr><td><a href="'+d.file+'">'+d.name+'</a> <span class="code">'+d.code+'</span></td>'
      +'<td style="text-align:center;white-space:nowrap">'+bar+'<span class="score-num">'+d.score+'</span></td>'
      +'<td style="text-align:center">'+fwd+'</td>'
      +'<td style="text-align:center">'+rating+'</td>'
      +'<td style="text-align:center">'+dvc+'</td>'
      +'<td>'+node+'</td>'
      +'<td><span class="tag '+typeClass(d.type)+'">'+d.type+'</span></td>'
      +'<td style="color:#888;white-space:nowrap">'+d.date+'</td></tr>';
  }).join('');
  if(!rows.length) tbody.innerHTML='<tr><td colspan="8" class="empty">没有匹配的报告</td></tr>';
}

function sort(k){
  if(sortKey===k){sortDir*=-1;}else{sortKey=k;sortDir=(k==='score'||k==='date')?-1:1;}
  updateArrows();
  render();
}

function updateArrows(){
  ['name','score','fwd','rating','type','date'].forEach(k=>{
    const el=document.getElementById('a-'+k);
    if(el) el.textContent=(k===sortKey)?(sortDir<0?'▼':'▲'):'';
  });
}

updateArrows();
render();
</script>
</body>
</html>
