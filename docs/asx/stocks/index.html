<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ASX个股报告 – 股票研究笔记</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;background:#f8f9fa;color:#333}
  .wrap{max-width:960px;margin:0 auto;padding:32px 16px}
  .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:20px;flex-wrap:wrap;gap:8px}
  .top h1{font-size:22px;font-weight:700}
  .top a{font-size:13px;color:#888;text-decoration:none}
  .top a:hover{color:#333}
  .toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
  .toolbar input,.toolbar select{padding:8px 12px;border:1px solid #ddd;border-radius:8px;font-size:13px;background:#fff;outline:none;font-family:inherit}
  .toolbar input{flex:1;min-width:180px}
  .toolbar input:focus,.toolbar select:focus{border-color:#888}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;border:1px solid #eee}
  th{background:#f8f8f8;padding:10px 12px;font-size:12px;font-weight:600;color:#666;text-align:left;cursor:pointer;user-select:none;white-space:nowrap;border-bottom:1px solid #eee}
  th:hover{background:#f0f0f0}
  th .arrow{color:#bbb;margin-left:3px;font-size:11px}
  td{padding:10px 12px;font-size:13px;border-bottom:1px solid #f5f5f5}
  tr:hover td{background:#fafafa}
  tr:last-child td{border-bottom:none}
  .tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
  .tag-cycle{background:#ffebee;color:#c62828}
  .tag-mix{background:#fff3e0;color:#e65100}
  .tag-growth{background:#e8f5e9;color:#2e7d32}
  .tag-def{background:#e3f2fd;color:#1565c0}
  .tag-special{background:#f3e5f5;color:#7b1fa2}
  .count-bar{color:#888;font-size:13px;margin-bottom:12px}
  .empty{text-align:center;color:#aaa;padding:40px;font-size:14px}
  .footer{text-align:center;font-size:12px;color:#ccc;margin-top:40px}
  a{color:#1a73e8;text-decoration:none}
  a:hover{text-decoration:underline}
  .code{color:#999;font-size:12px}
  .badge{display:inline-block;padding:2px 9px;border-radius:4px;font-size:11px;font-weight:700;white-space:nowrap}
  .fwd-s{background:#e8f5e9;color:#1b5e20}
  .fwd-a{background:#f1f8e9;color:#558b2f}
  .fwd-b{background:#fffde7;color:#f9a825}
  .fwd-c{background:#fff3e0;color:#e65100}
  .fwd-d{background:#fde8e8;color:#c0392b}
  .rating-buy{background:#e8f5e9;color:#1b5e20}
  .rating-outperform{background:#f1f8e9;color:#558b2f}
  .rating-neutral{background:#eeeeee;color:#616161}
  .rating-underperform{background:#fff3e0;color:#e65100}
  .rating-sell{background:#fde8e8;color:#c0392b}
  .node{color:#666;font-size:12px}
  .warn{color:#e67e22;font-weight:700;cursor:help}
  .muted{color:#ccc}
  .score-num{font-size:12px;color:#555;margin-left:6px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>📋 ASX个股报告</h1>
    <a href="../index.html">← 返回ASX首页</a>
  </div>

  <div class="toolbar">
    <input type="text" id="search" placeholder="搜索股票名称或代码…" oninput="render()">
    <select id="filter" onchange="render()">
      <option value="">全部类型</option>
      <option value="成长性">成长性</option>
      <option value="混合周期">混合周期</option>
      <option value="周期性">周期性</option>
      <option value="防御性">防御性</option>
      <option value="特殊行业">特殊行业</option>
    </select>
    <select id="abfilter" onchange="render()">
      <option value="">全部（含无标记）</option>
      <option value="high">⚡ 高分·前瞻不利</option>
      <option value="low">⚡ 低分·前瞻有利</option>
    </select>
  </div>

  <div class="count-bar" id="count">共 26 份</div>

  <table>
    <thead>
      <tr>
        <th onclick="sort('name')">股票 <span class="arrow" id="a-name"></span></th>
        <th onclick="sort('score')" style="text-align:center">财务分 <span class="arrow" id="a-score">▼</span></th>
        <th onclick="sort('fwd')" style="text-align:center">前瞻 <span class="arrow" id="a-fwd"></span></th>
        <th onclick="sort('rating')" style="text-align:center">评级 <span class="arrow" id="a-rating"></span></th>
        <th style="text-align:center">背离</th>
        <th>验证节点</th>
        <th onclick="sort('type')">L5分类 <span class="arrow" id="a-type"></span></th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="footer">仅限个人研究参考</div>
</div>

<script>
const data = [
  {"name": "ResMed", "code": "RMD", "type": "防御性", "score": 97, "fwd": "", "rating": "", "node": "", "date": "2026-10-14", "file": "ResMed_RMD_分析报告.html"},
  {"name": "Hub24", "code": "HUB", "type": "成长性", "score": 94, "fwd": "", "rating": "", "node": "", "date": "2026-10-14", "file": "Hub24_HUB_ASX_分析报告.html"},
  {"name": "Objective Corp", "code": "OCL", "type": "成长性", "score": 91, "fwd": "", "rating": "", "node": "", "date": "2026-10-14", "file": "ObjectiveCorp_OCL_分析报告.html"},
  {"name": "IAG", "code": "IAG", "type": "防御性", "score": 88, "fwd": "", "rating": "", "node": "", "date": "2026-08-25", "file": "IAG_IAG_分析报告.html"},
  {"name": "CSL Limited", "code": "CSL", "type": "成长性", "score": 88, "fwd": "", "rating": "", "node": "", "date": "2026-07-14", "file": "CSL_CSL_分析报告.html"},
  {"name": "PolyNovo", "code": "PNV", "type": "成长性", "score": 87, "fwd": "", "rating": "", "node": "", "date": "2026-07-14", "file": "PolyNovo_PNV_ASX_分析报告.html"},
  {"name": "JB Hi-Fi", "code": "JBH", "type": "防御性", "score": 87, "fwd": "", "rating": "", "node": "", "date": "2026-08-25", "file": "JB Hi-Fi_JBH_分析报告.html"},
  {"name": "QBE", "code": "QBE", "type": "防御性", "score": 86, "fwd": "", "rating": "", "node": "", "date": "2026-08-25", "file": "QBE_QBE_ASX_分析报告.html"},
  {"name": "Pro Medicus", "code": "PME", "type": "周期性", "score": 85, "fwd": "", "rating": "", "node": "", "date": "2026-07-14", "file": "Pro Medicus_PME_分析报告.html"},
  {"name": "Suncorp", "code": "SUN", "type": "防御性", "score": 84, "fwd": "", "rating": "", "node": "", "date": "2026-08-25", "file": "Suncorp_SUN_分析报告.html"},
  {"name": "REA Group", "code": "REA", "type": "周期性", "score": 84, "fwd": "", "rating": "", "node": "", "date": "2026-10-14", "file": "REA Group_REA_分析报告.html"},
  {"name": "Nanosonics", "code": "NAN", "type": "成长性", "score": 80, "fwd": "", "rating": "", "node": "", "date": "2026-07-14", "file": "Nanosonics_NAN_分析报告.html"},
  {"name": "HansenTech", "code": "HSN", "type": "防御性", "score": 80, "fwd": "", "rating": "", "node": "", "date": "2026-10-14", "file": "HansenTech_HSN_分析报告.html"},
  {"name": "IPH Limited", "code": "IPH", "type": "防御性", "score": 79, "fwd": "", "rating": "", "node": "", "date": "2026-08-25", "file": "IPH_IPH_分析报告.html"},
  {"name": "BHP Group Limited", "code": "BHP", "type": "周期性", "score": 78, "fwd": "", "rating": "", "node": "", "date": "2026-08-17", "file": "BHP_BHP_ASX_分析报告.html"},
  {"name": "Cochlear", "code": "COH", "type": "成长性", "score": 76, "fwd": "", "rating": "", "node": "", "date": "2026-07-14", "file": "Cochlear_COH_分析报告.html"},
  {"name": "Brambles", "code": "BXB", "type": "防御性", "score": 73, "fwd": "", "rating": "", "node": "", "date": "2026-08-25", "file": "Brambles_BXB_分析报告.html"},
  {"name": "Macquarie Group", "code": "MQG", "type": "防御性", "score": 70, "fwd": "", "rating": "", "node": "", "date": "2026-07-14", "file": "Macquarie_MQG_分析报告.html"},
  {"name": "Woodside Energy Group Ltd", "code": "WDS", "type": "周期性", "score": 69, "fwd": "", "rating": "", "node": "", "date": "2026-07-09", "file": "Woodside_WDS_ASX_分析报告.html"},
  {"name": "Lovisa", "code": "LOV", "type": "成长性", "score": 67, "fwd": "", "rating": "", "node": "", "date": "2026-08-25", "file": "Lovisa_LOV_分析报告.html"},
  {"name": "PWR Holdings", "code": "PWH", "type": "成长性", "score": 62, "fwd": "", "rating": "", "node": "", "date": "2026-07-14", "file": "PWR_PWH_ASX_分析报告.html"},
  {"name": "Sandfire Resources", "code": "SFR", "type": "周期性", "score": 61, "fwd": "", "rating": "", "node": "", "date": "2026-07-13", "file": "Sandfire_SFR_ASX_分析报告.html"},
  {"name": "Coles", "code": "COL", "type": "防御性", "score": 61, "fwd": "", "rating": "", "node": "", "date": "2026-08-25", "file": "Coles_COL_分析报告.html"},
  {"name": "Cleanaway", "code": "CWY", "type": "防御性", "score": 57, "fwd": "", "rating": "", "node": "", "date": "2026-08-25", "file": "Cleanaway_CWY_分析报告.html"},
  {"name": "Lincoln Minerals", "code": "LML", "type": "成长性", "score": 49, "fwd": "", "rating": "", "node": "", "date": "2026-07-14", "file": "Lincoln_Minerals_LML_ASX_分析报告.html"},
  {"name": "Transurban", "code": "TCL", "type": "防御性", "score": 45, "fwd": "", "rating": "", "node": "", "date": "2026-08-25", "file": "Transurban_TCL_分析报告.html"}];

let sortKey='rating', sortDir=1;
const ratingRank={Buy:0,Outperform:1,Neutral:2,Underperform:3,Sell:4};
const fwdRank={S:0,A:1,B:2,C:3,D:4};

function scoreColor(s){
  if(s>=80) return '#4caf50';
  if(s>=60) return '#ff9800';
  if(s>=40) return '#f44336';
  return '#9c27b0';
}

function typeClass(t){
  const m={'周期性':'tag-cycle','混合周期':'tag-mix','成长性':'tag-growth','防御性':'tag-def','特殊行业':'tag-special'};
  return m[t]||'tag-cycle';
}

function divergence(d){
  const hi = d.score>=80;
  const gf = d.fwd==='S'||d.fwd==='A';
  const bf = d.fwd==='C'||d.fwd==='D';
  if(hi&&bf) return 'high';
  if(!hi&&gf) return 'low';
  return '';
}

function sortVal(d,k){
  if(k==='rating') return ratingRank[d.rating]!==undefined?ratingRank[d.rating]:9;
  if(k==='fwd') return fwdRank[d.fwd]!==undefined?fwdRank[d.fwd]:9;
  if(k==='score') return d.score;
  if(k==='name') return d.name;
  return d[k];
}

function render(){
  const q=document.getElementById('search').value.trim().toLowerCase();
  const f=document.getElementById('filter').value;
  const af=document.getElementById('abfilter').value;
  let rows=data.filter(d=>(!q||d.name.toLowerCase().includes(q)||d.code.toLowerCase().includes(q))&&(!f||d.type===f)&&(!af||divergence(d)===af));
  rows.sort((a,b)=>{
    const v=sortVal(a,sortKey),w=sortVal(b,sortKey);
    if(v<w) return -sortDir;
    if(v>w) return sortDir;
    if(sortKey!=='score'&&a.score!==b.score) return b.score-a.score;
    return 0;
  });
  document.getElementById('count').textContent='共 '+rows.length+' 份';
  const tbody=document.getElementById('tbody');
  tbody.innerHTML=rows.map(d=>{
    const bar='<span class="score-bar" style="width:'+d.score+'%;background:'+scoreColor(d.score)+'"></span>';
    const fwd=d.fwd?'<span class="badge fwd-'+d.fwd.toLowerCase()+'">'+d.fwd+'</span>':'<span class="muted">—</span>';
    const rating=d.rating?'<span class="badge rating-'+d.rating.toLowerCase()+'">'+d.rating+'</span>':'<span class="muted">—</span>';
    const dv=divergence(d);
    const dvc=dv?'<span class="warn" title="'+(dv==='high'?'财务高分但前瞻不利':'财务低分但前瞻有利')+'">⚡</span>':'';
    const node=d.node?'<span class="node">'+d.node+'</span>':'';
    return '<tr><td><a href="'+d.file+'">'+d.name+'</a> <span class="code">'+d.code+'</span></td>'
      +'<td style="text-align:center;white-space:nowrap">'+bar+'<span class="score-num">'+d.score+'</span></td>'
      +'<td style="text-align:center">'+fwd+'</td>'
      +'<td style="text-align:center">'+rating+'</td>'
      +'<td style="text-align:center">'+dvc+'</td>'
      +'<td>'+node+'</td>'
      +'<td><span class="tag '+typeClass(d.type)+'">'+d.type+'</span></td></tr>';
  }).join('');
  if(!rows.length) tbody.innerHTML='<tr><td colspan="7" class="empty">没有匹配的报告</td></tr>';
}

function sort(k){
  if(sortKey===k){sortDir*=-1;}else{sortKey=k;sortDir=(k==='score')?-1:1;}
  updateArrows();
  render();
}

function updateArrows(){
  ['name','score','fwd','rating','type'].forEach(k=>{
    const el=document.getElementById('a-'+k);
    if(el) el.textContent=(k===sortKey)?(sortDir<0?'▼':'▲'):'';
  });
}

updateArrows();
render();
</script>
</body>
</html>
