name: 自动检查财报并更新个股

on:
  schedule:
    # Sydney 08:30: AEDT -> UTC 21:30, AEST -> UTC 22:30 (previous day).
    # The plan job skips the inactive schedule, including when a job starts late.
    - cron: '30 21 * * *'
    - cron: '30 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 1) 只检查，不调用模型：决定这次要更新哪几只股票。
  plan:
    if: github.repository == 'YannickZammberdi/zammberdi_stock_selection'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      count: ${{ steps.check.outputs.count }}
      queue: ${{ steps.check.outputs.queue }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 检查是否有未覆盖的新财报
        id: check
        env:
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: python scripts/auto_update_stocks.py --plan

  # 2) 每只股票一个独立 job：互不影响，可单独重跑，日志分开。
  update:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        stock: ${{ fromJSON(needs.plan.outputs.queue) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 安装 opencode
        run: npm install -g opencode-ai
      - name: 生成 ${{ matrix.stock.name }}（${{ matrix.stock.period }}）
        env:
          ZEN_API_KEY: ${{ secrets.ZEN_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          REPORT_PERIOD: ${{ matrix.stock.period }}
          REPORT_PUBLISHED: ${{ matrix.stock.published }}
          MODEL_TIMEOUT_SECONDS: '600'
        run: python scripts/auto_update_stocks.py --generate-only --code ${{ matrix.stock.code }} --outdir results
      - name: 上传生成结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.stock.code }}
          path: results/
          if-no-files-found: warn
          retention-days: 7

  # 3) 统一校验、刷新索引、一次提交推送：避免并发写同一分支。
  publish:
    needs: [plan, update]
    if: always() && needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: report-sync
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 下载生成结果
        uses: actions/download-artifact@v4
        with:
          pattern: report-*
          path: results
      - name: 写入报告并同步 Pages 索引
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python scripts/auto_update_stocks.py --publish results
