name: 自动检查财报并更新个股

on:
  schedule:
    # Sydney 08:30: AEDT -> UTC 21:30, AEST -> UTC 22:30 (previous day).
    # The check script skips the inactive schedule, including when a job starts late.
    - cron: '30 21 * * *'
    - cron: '30 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    if: github.repository == 'YannickZammberdi/zammberdi_stock_selection'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    # 与已有生成流程的 sync job 共用锁，避免覆盖并发更新。
    concurrency:
      group: report-sync
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 检查是否有未覆盖的新财报（不调用模型）
        id: check
        env:
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: python scripts/auto_update_stocks.py
      - uses: actions/setup-node@v4
        if: steps.check.outputs.count != '0'
        with:
          node-version: '22'
      - name: 安装 opencode
        if: steps.check.outputs.count != '0'
        run: npm install -g opencode-ai
      - name: 自动更新并同步 Pages 索引
        if: steps.check.outputs.count != '0'
        env:
          ZEN_API_KEY: ${{ secrets.ZEN_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python scripts/auto_update_stocks.py --run
