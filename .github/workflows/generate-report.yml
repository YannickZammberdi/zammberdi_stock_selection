name: 生成股票分析报告

on:
  workflow_dispatch:
    inputs:
      type:
        description: '报告类型：stock=个股财务分析 / industry=行业分析 / macro=宏观环境 / plan=交易计划 / verify=C方案验证 / fund=基金体检'
        required: true
        type: choice
        options:
          - stock
          - industry
          - macro
          - plan
          - verify
          - fund
      market:
        description: '市场'
        required: true
        default: 'A股'
        type: choice
        options:
          - 'A股'
          - 'ASX'
      name:
        description: '股票名称或行业名（type=stock/plan/verify 填股票名称如 药明康德；type=industry 填行业名如 光伏；macro 留空）'
        required: false
        default: ''
        type: string
      model:
        description: '模型（zen免费 / deepseek官方API）'
        required: false
        default: 'opencode/nemotron-3.5-lightning-free'
        type: choice
        options:
          - opencode/nemotron-3.5-lightning-free
          - opencode/nemotron-3-ultra-free
          - opencode/hy3-free
          - opencode/x-preview-f-free
          - opencode/mimo-v2.5-free
          - opencode/muse-spark-1.2-contributor-free
          - opencode/big-pickle
          - deepseek/deepseek-v4-flash
          - deepseek/deepseek-chat
          - deepseek/deepseek-reasoner
          - deepseek/deepseek-v4-pro

permissions:
  contents: write

jobs:
  # ---- 生成报告：不同标的并行，同一标的重复触发排队 ----
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: report-gen-${{ github.event.inputs.type }}-${{ github.event.inputs.name }}
      cancel-in-progress: false
    steps:
      - name: 权限检查（仅限本人触发）
        env:
          ACTOR: ${{ github.triggering_actor }}
        run: |
          if [ "$ACTOR" != "YannickZammberdi" ]; then
            echo "非授权用户 $ACTOR 触发，拒绝执行"
            exit 1
          fi

      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 安装 opencode
        run: npm install -g opencode-ai

      - name: 构造提示词
        id: prompt
        env:
          RTYPE: ${{ github.event.inputs.type }}
          RMARKET: ${{ github.event.inputs.market }}
          RNAME: ${{ github.event.inputs.name }}
        run: |
          case "$RTYPE" in
            stock)     P="使用 stock-report-tab skill，为 $RMARKET 股票 $RNAME 生成财务分析报告，保存到 stock-learning/stocks-analysis/ 下" ;;
            industry)  P="使用 l7-screening skill，筛一下 $RMARKET $RNAME 行业，生成行业分析报告" ;;
            macro)     P="使用 macro-report skill，生成 $RMARKET 大盘宏观环境分析报告" ;;
            plan)      P="使用 stock-trade-plan skill，为 $RMARKET 股票 $RNAME 生成交易计划" ;;
            verify)    P="使用 c-plan-verify skill，为 $RMARKET 股票 $RNAME 跑 C方案验证" ;;
            fund)      P="使用 fund-report skill，为 $RMARKET 基金 $RNAME 生成基金体检报告（F1-F4，单页），保存到 stock-learning/stocks-analysis/基金/ 下" ;;
            *)         echo "未知报告类型: $RTYPE"; exit 1 ;;
          esac
          echo "PROMPT=$P" >> "$GITHUB_ENV"

      - name: 运行 opencode 生成报告
        env:
          ZEN_API_KEY: ${{ secrets.ZEN_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          echo ">> PROMPT: $PROMPT"
          opencode run --model "${{ github.event.inputs.model }}" --auto "$PROMPT"

      - name: 打包生成的文件（交给 sync job 合并）
        run: |
          mkdir -p /tmp/report
          git status --porcelain -z -- stock-learning | tr '\0' '\n' | cut -c4- | sort -u > /tmp/report/changed.txt
          if [ -s /tmp/report/changed.txt ]; then
            tar -czf /tmp/report/report.tar.gz -T /tmp/report/changed.txt
            echo "本次生成的文件："
            cat /tmp/report/changed.txt
          else
            echo "no changes" > /tmp/report/EMPTY
          fi

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ github.run_id }}
          path: /tmp/report
          if-no-files-found: warn

  # ---- 同步+提交+推送：全局串行，避免 push 冲突 ----
  sync:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: report-sync
      cancel-in-progress: false
      queue: max
    steps:
      - name: 检出代码（完整历史）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 对齐到最新 master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin
          git reset --hard origin/master

      - name: 下载产物
        uses: actions/download-artifact@v4
        with:
          name: report-${{ github.run_id }}
          path: /tmp/report

      - name: 合并生成文件到源目录
        run: |
          if [ ! -f /tmp/report/report.tar.gz ]; then
            echo "无生成产物，跳过"
            exit 0
          fi
          tar -xzf /tmp/report/report.tar.gz -C .

      - name: 同步到 docs（GitHub Pages）
        run: python scripts/sync_ghpages.py

      - name: 提交并推送
        env:
          RTYPE: ${{ github.event.inputs.type }}
          RNAME: ${{ github.event.inputs.name }}
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "无文件变更，跳过提交"
            exit 0
          fi
          git commit -m "generate report ($RTYPE / $RNAME) via workflow"
          git push